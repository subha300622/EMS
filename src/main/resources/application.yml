spring:
  application:
    name: ems-backend
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
    out-of-order: true
    repair-on-migrate: false
  data:
    redis:
      url: ${REDIS_URL}
  cache:
    type: simple
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: ${PORT}
  address: 0.0.0.0
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: always

ems:
  logging:
    post-api-path: ${POST_API_LOG_FILE}

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}

security:
  jwt:
    secret: ${JWT_SECRET}

encryption:
  aes-key: ${AES_ENCRYPTION_KEY}

app:
  seed:
    domain: ${APP_SEED_DOMAIN}
    admin-password: ${PLATFORM_ADMIN_PASSWORD}
  email:
    sender-address: ${APP_EMAIL_SENDER_ADDRESS}
  base-url: ${APP_BASE_URL}
  frontend-url: ${FRONTEND_URL}
  asset-verification-url: ${ASSET_VERIFICATION_URL}
  dicebear-avatar-url: ${DICEBEAR_AVATAR_URL}
  kafka:
    enabled: ${KAFKA_ENABLED}

integrations:
  slack-webhook: ${SLACK_WEBHOOK_URL}
  jira-base-url: ${JIRA_BASE_URL}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    filter: true

razorpay:
  enabled: ${RAZORPAY_ENABLED}
  mode: ${RAZORPAY_MODE}
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
  currency: ${RAZORPAY_CURRENCY}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true

kafka:
  topics:
    partitions: 3
  outbox:
    poll-interval-ms: 2000
