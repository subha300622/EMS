spring:
  application:
    name: ems-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:emsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
    out-of-order: true
    repair-on-migrate: false
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  cache:
    type: simple
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: always

ems:
  logging:
    post-api-path: ${POST_API_LOG_FILE:post_api_payloads.log}

resend:
  api-key: ${RESEND_API_KEY:re_dummy_key}
  from-email: ${RESEND_FROM_EMAIL:EMS System <noreply@company.com>}

app:
  seed:
    domain: company.com
  email:
    sender-address: noreply@company.com
  base-url: ${APP_BASE_URL:http://localhost:3000}
  kafka:
    enabled: false # Disabled by default

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    filter: true

razorpay:
  enabled: true
  mode: LIVE
  key-id: ${RAZORPAY_KEY_ID:rzp_live_StUZupmMw4H4yc}
  key-secret: ${RAZORPAY_KEY_SECRET:uq9yq68G6Dydj3FJXgobDeB0}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:webhook_secret}
  currency: INR

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true

kafka:
  topics:
    partitions: 3
  outbox:
    poll-interval-ms: 2000
