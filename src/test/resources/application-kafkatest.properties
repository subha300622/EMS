# Kafka test profile - uses EmbeddedKafka so no external broker needed
spring.application.name=ems-backend-kafkatest

# Database - use same PostgreSQL as tests
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/employee_db
spring.datasource.username=ems_user
spring.datasource.password=12345
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true
spring.flyway.out-of-order=true
spring.flyway.repair-on-migrate=true

# Redis
spring.data.redis.url=${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Email - test values
resend.api-key=re_dummy_key_for_test
resend.from-email=EMS System <noreply@company.com>

# App
app.seed.domain=company.com
app.email.sender-address=noreply@company.com
app.base-url=http://localhost:3000

# Error handling
server.error.include-stacktrace=never
server.error.include-message=always

# Swagger
springdoc.swagger-ui.disable-swagger-default-url=true

# Razorpay
razorpay.enabled=true
razorpay.mode=TEST
razorpay.key-id=rzp_test_dummy
razorpay.key-secret=test_secret
razorpay.webhook-secret=webhook_secret
razorpay.currency=INR

# Kafka - EmbeddedKafka will override bootstrap-servers automatically
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# Kafka topic config
kafka.topics.partitions=1

# Disable outbox scheduler in tests (we trigger manually)
kafka.outbox.poll-interval-ms=999999999
