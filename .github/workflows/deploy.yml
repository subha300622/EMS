name: EMS Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: subha300622/ems-backend

jobs:

  # ============================================================
  # 1. BUILD + TEST + FLYWAY VALIDATION
  # ============================================================
  build-and-test:
    name: Build, Test & Validate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      FLYWAY_URL: ${{ secrets.FLYWAY_URL }}
      FLYWAY_USER: ${{ secrets.FLYWAY_USER }}
      FLYWAY_PASSWORD: ${{ secrets.FLYWAY_PASSWORD }}

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Flyway migrations
        run: |
          mvn --batch-mode flyway:validate

      - name: Build and run tests
        run: |
          mvn --batch-mode clean verify


  # ============================================================
  # 2. BUILD + PUSH DOCKER IMAGE
  # ============================================================
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # 3. DEPLOY PRODUCTION
  # ============================================================
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: docker

    environment:
      name: production

    steps:

      - name: Deploy production image
        env:
          IMAGE: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          echo "=========================================="
          echo "Deploying EMS Backend"
          echo "=========================================="
          echo "Image: $IMAGE"
          echo "Environment: production"
