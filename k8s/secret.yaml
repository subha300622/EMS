apiVersion: v1
kind: Secret
metadata:
  name: ems-secret
  namespace: ems
type: Opaque
# SECURITY: Do NOT commit real secret values to Git.
# Manage secrets exclusively through your secret-management system
# (kubectl create secret, Vault, Sealed Secrets, or CI/CD injection).
#
# To create/update this secret in the cluster:
#   JWT_SECRET=$(openssl rand -base64 64)
#   kubectl -n ems create secret generic ems-secret \
#     --from-literal=JWT_SECRET="$JWT_SECRET" \
#     --from-literal=SPRING_DATASOURCE_PASSWORD="<db-password>" \
#     --from-literal=RAZORPAY_KEY_SECRET="<razorpay-key-secret>" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Required keys (startup fails if any is absent):
#   JWT_SECRET                 - HS256 signing key, ≥32 bytes
#   SPRING_DATASOURCE_PASSWORD - PostgreSQL password
#   RAZORPAY_KEY_SECRET        - Razorpay API secret
#
# The placeholder values below are intentionally not valid base64
# so this file cannot be applied as-is — you must supply real values.
data:
  JWT_SECRET: "REPLACE_WITH_BASE64_ENCODED_SECRET_FROM_openssl_rand_base64_64"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_WITH_BASE64_ENCODED_DB_PASSWORD"
  RAZORPAY_KEY_SECRET: "REPLACE_WITH_BASE64_ENCODED_RAZORPAY_SECRET"
